<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 220" role="img" aria-labelledby="court-diagram-title court-diagram-desc">
  <title id="court-diagram-title">アルティメットのコート図解</title>
  <desc id="court-diagram-desc">
    縦64m×横37mのプレイングフィールドと、両端に18mのエンドゾーンを持つコート全体の規格を示した図。
  </desc>

  <!-- プレイングフィールド -->
  <rect x="96" y="25" width="308" height="150" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="2" />
  <!-- エンドゾーン（両端） -->
  <rect x="10" y="25" width="86" height="150" fill="#e0f2fe" stroke="#a7f3d0" stroke-width="2" />
  <rect x="404" y="25" width="86" height="150" fill="#e0f2fe" stroke="#a7f3d0" stroke-width="2" />

  <text x="53" y="105" text-anchor="middle" fill="#0369a1" font-size="13" font-weight="600" font-family="sans-serif">エンド</text>
  <text x="53" y="121" text-anchor="middle" fill="#0369a1" font-size="13" font-weight="600" font-family="sans-serif">ゾーン</text>
  <text x="447" y="105" text-anchor="middle" fill="#0369a1" font-size="13" font-weight="600" font-family="sans-serif">エンド</text>
  <text x="447" y="121" text-anchor="middle" fill="#0369a1" font-size="13" font-weight="600" font-family="sans-serif">ゾーン</text>
  <text x="250" y="105" text-anchor="middle" fill="#334155" font-size="14" font-weight="600" font-family="sans-serif">プレイングフィールド</text>

  <!-- 幅37mの寸法線 -->
  <line x1="512" y1="25" x2="512" y2="175" stroke="#64748b" stroke-width="1.5" />
  <line x1="506" y1="25" x2="518" y2="25" stroke="#64748b" stroke-width="1.5" />
  <line x1="506" y1="175" x2="518" y2="175" stroke="#64748b" stroke-width="1.5" />
  <text x="530" y="104" text-anchor="middle" fill="#64748b" font-size="12" font-family="sans-serif" transform="rotate(-90 530 104)">37m</text>

  <!-- 長さの寸法線 -->
  <line x1="10" y1="195" x2="96" y2="195" stroke="#64748b" stroke-width="1.5" />
  <line x1="10" y1="190" x2="10" y2="200" stroke="#64748b" stroke-width="1.5" />
  <line x1="96" y1="190" x2="96" y2="200" stroke="#64748b" stroke-width="1.5" />
  <text x="53" y="213" text-anchor="middle" fill="#64748b" font-size="12" font-family="sans-serif">18m</text>

  <line x1="96" y1="195" x2="404" y2="195" stroke="#64748b" stroke-width="1.5" />
  <line x1="96" y1="190" x2="96" y2="200" stroke="#64748b" stroke-width="1.5" />
  <line x1="404" y1="190" x2="404" y2="200" stroke="#64748b" stroke-width="1.5" />
  <text x="250" y="213" text-anchor="middle" fill="#64748b" font-size="12" font-family="sans-serif">64m</text>

  <line x1="404" y1="195" x2="490" y2="195" stroke="#64748b" stroke-width="1.5" />
  <line x1="404" y1="190" x2="404" y2="200" stroke="#64748b" stroke-width="1.5" />
  <line x1="490" y1="190" x2="490" y2="200" stroke="#64748b" stroke-width="1.5" />
  <text x="447" y="213" text-anchor="middle" fill="#64748b" font-size="12" font-family="sans-serif">18m</text>
</svg>
