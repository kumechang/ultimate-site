<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" role="img" aria-labelledby="cup-diagram-title cup-diagram-desc">
  <title id="cup-diagram-title">カップの図解</title>
  <desc id="cup-diagram-desc">ディフェンス3人がディスク保持者を前方から囲む「カップ」と、後方をカバーする「ディープ」の配置を示した図。</desc>

  <rect x="10" y="10" width="380" height="260" rx="10" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="2" />

  <path d="M 150 165 A 60 60 0 0 1 250 165" fill="none" stroke="#cbd5e1" stroke-width="18" stroke-linecap="round" />

  <circle cx="150" cy="160" r="13" fill="#1e293b" />
  <circle cx="200" cy="130" r="13" fill="#1e293b" />
  <circle cx="250" cy="160" r="13" fill="#1e293b" />

  <circle cx="200" cy="210" r="14" fill="#0284c7" />
  <text x="200" y="240" text-anchor="middle" fill="#334155" font-size="11" font-weight="600" font-family="sans-serif">ディスク保持者</text>

  <circle cx="110" cy="55" r="13" fill="#64748b" />
  <circle cx="290" cy="55" r="13" fill="#64748b" />

  <text x="200" y="105" text-anchor="middle" fill="#334155" font-size="13" font-weight="600" font-family="sans-serif">カップ</text>
  <text x="200" y="35" text-anchor="middle" fill="#64748b" font-size="12" font-weight="600" font-family="sans-serif">ディープ（後方カバー）</text>
</svg>
