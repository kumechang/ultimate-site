<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" role="img" aria-labelledby="vstack-diagram-title vstack-diagram-desc">
  <title id="vstack-diagram-title">バーティカルスタックの図解</title>
  <desc id="vstack-diagram-desc">コート中央に選手が縦一列に並び、1人がサイドスペースへ動いてパスを受ける様子を示した図。</desc>

  <rect x="10" y="10" width="380" height="260" rx="10" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="2" />

  <!-- カットの軌道 -->
  <path d="M 205 72 C 260 60 300 58 318 58" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#vstack-cut-arrow)" />

  <!-- パス -->
  <path d="M 210 222 C 270 170 300 110 316 68" fill="none" stroke="#0284c7" stroke-width="3" marker-end="url(#vstack-pass-arrow)" />

  <defs>
    <marker id="vstack-cut-arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#94a3b8" />
    </marker>
    <marker id="vstack-pass-arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0284c7" />
    </marker>
  </defs>

  <!-- スタック（縦列） -->
  <circle cx="200" cy="70" r="13" fill="#1e293b" />
  <circle cx="200" cy="105" r="13" fill="#1e293b" />
  <circle cx="200" cy="140" r="13" fill="#1e293b" />
  <circle cx="200" cy="175" r="13" fill="#1e293b" />
  <text x="245" y="144" text-anchor="start" fill="#334155" font-size="12" font-weight="600" font-family="sans-serif">スタック（縦列）</text>

  <!-- カット後の選手（空いたスペース） -->
  <circle cx="330" cy="58" r="13" fill="none" stroke="#1e293b" stroke-width="2" stroke-dasharray="3 2" />
  <text x="330" y="40" text-anchor="middle" fill="#64748b" font-size="11" font-family="sans-serif">カッターの動き</text>

  <!-- スロワー -->
  <circle cx="200" cy="225" r="14" fill="#0284c7" />
  <text x="200" y="255" text-anchor="middle" fill="#334155" font-size="11" font-weight="600" font-family="sans-serif">スロワー</text>
</svg>
