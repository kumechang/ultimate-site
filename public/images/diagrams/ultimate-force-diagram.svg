<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 230" role="img" aria-labelledby="force-diagram-title force-diagram-desc">
  <title id="force-diagram-title">フォースの図解</title>
  <desc id="force-diagram-desc">マーカーがスロワーの片側に立つことで、投げる方向を反対側に限定させる様子を示した図。</desc>

  <rect x="10" y="10" width="380" height="210" rx="10" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="2" />

  <line x1="200" y1="10" x2="200" y2="220" stroke="#a7f3d0" stroke-width="1.5" stroke-dasharray="4 4" />

  <path d="M 230 115 L 30 30 A 130 130 0 0 1 30 200 Z" fill="rgba(15,23,42,0.05)" />

  <path d="M 245 115 C 300 90 340 90 375 65" fill="none" stroke="#0284c7" stroke-width="3" marker-end="url(#force-arrow)" />

  <defs>
    <marker id="force-arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0284c7" />
    </marker>
  </defs>

  <circle cx="150" cy="115" r="14" fill="#1e293b" />
  <text x="150" y="150" text-anchor="middle" fill="#334155" font-size="11" font-weight="600" font-family="sans-serif">マーカー</text>

  <circle cx="230" cy="115" r="14" fill="#0284c7" />
  <text x="230" y="150" text-anchor="middle" fill="#334155" font-size="11" font-weight="600" font-family="sans-serif">スロワー</text>

  <text x="70" y="60" text-anchor="middle" fill="#64748b" font-size="11" font-family="sans-serif">投げにくい側</text>
  <text x="70" y="76" text-anchor="middle" fill="#64748b" font-size="11" font-family="sans-serif">（ブロックされている）</text>

  <text x="310" y="55" text-anchor="middle" fill="#0369a1" font-size="12" font-weight="600" font-family="sans-serif">フォースの方向</text>
  <text x="310" y="71" text-anchor="middle" fill="#0369a1" font-size="11" font-family="sans-serif">（投げやすい側）</text>
</svg>
